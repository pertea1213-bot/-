<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨설팅 일정관리 - 관리자</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .topnav { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .topnav a { color: #4a5568; text-decoration: none; font-size: 0.9rem; }
  .topnav a:hover { text-decoration: underline; }
  h1 { font-size: 1.6rem; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #2d3748; }
  label { display: block; font-size: 0.85rem; color: #4a5568; margin-bottom: 6px; font-weight: 600; }
  input, select {
    padding: 9px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #4299e1; }
  .btn-primary {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #4299e1;
    color: #fff;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: #3182ce; }
  .btn-secondary {
    padding: 6px 12px;
    border: 1px solid #cbd5e0;
    border-radius: 8px;
    background: #fff;
    color: #4a5568;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: #a0aec0; }
  .btn-danger {
    padding: 6px 12px;
    border: 1px solid #fc8181;
    border-radius: 8px;
    background: #fff;
    color: #e53e3e;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .btn-danger:hover { background: #fff5f5; }
  #login-view { max-width: 360px; margin: 60px auto; }
  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; display: none; }
  .msg.error { display: block; background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
  .msg.success { display: block; background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .filters > div { display: flex; flex-direction: column; gap: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #edf2f7; vertical-align: top; }
  th { color: #718096; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  .badge { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; }
  .badge.pending { background: #fffaf0; color: #c05621; }
  .badge.confirmed { background: #ebf8ff; color: #2b6cb0; }
  .badge.completed { background: #f0fff4; color: #276749; }
  .badge.cancelled { background: #f7fafc; color: #a0aec0; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .weekday-checks { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .weekday-checks label { display: flex; align-items: center; gap: 4px; font-weight: 400; }
  .types-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .type-chip { background: #edf2f7; border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }
  .type-chip button { border: none; background: none; color: #a0aec0; cursor: pointer; font-size: 0.9rem; line-height: 1; }
  .add-type-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .empty { color: #a0aec0; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="consulting-booking.html">&larr; 예약 페이지로</a>
    <div style="display:flex; gap:16px; align-items:center;">
      <a href="pm.html">PM 관리 툴</a>
      <a href="#" id="logout-link" style="display:none;">로그아웃</a>
    </div>
  </div>

  <div id="login-view">
    <h1>관리자 로그인</h1>
    <div class="card">
      <form id="login-form">
        <label for="password">비밀번호</label>
        <input type="password" id="password" style="width:100%" required>
        <button type="submit" class="btn-primary" style="width:100%; margin-top:16px;">로그인</button>
        <div id="login-msg" class="msg"></div>
      </form>
    </div>
  </div>

  <div id="dashboard-view" style="display:none;">
    <h1>컨설팅 일정관리</h1>

    <div class="card">
      <h2>예약 목록</h2>
      <div class="filters">
        <div>
          <label for="filter-date">날짜</label>
          <input type="date" id="filter-date">
        </div>
        <div>
          <label for="filter-status">상태</label>
          <select id="filter-status">
            <option value="">전체</option>
            <option value="pending">대기중</option>
            <option value="confirmed">확정</option>
            <option value="completed">완료</option>
            <option value="cancelled">취소됨</option>
          </select>
        </div>
        <div>
          <button class="btn-secondary" id="refresh-btn">새로고침</button>
        </div>
        <div>
          <button class="btn-secondary" id="clear-filter-btn">필터 초기화</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>날짜</th><th>시간</th><th>이름</th><th>연락처</th><th>유형</th><th>메모</th><th>상태</th><th>작업</th></tr>
          </thead>
          <tbody id="appt-tbody"></tbody>
        </table>
        <div id="appt-empty" class="empty" style="display:none;">예약이 없습니다.</div>
      </div>
    </div>

    <div class="card">
      <h2>운영 설정</h2>
      <div class="settings-grid">
        <div>
          <label for="business-start">운영 시작</label>
          <input type="time" id="business-start">
        </div>
        <div>
          <label for="business-end">운영 종료</label>
          <input type="time" id="business-end">
        </div>
        <div>
          <label for="slot-minutes">상담 시간(분)</label>
          <input type="number" id="slot-minutes" min="10" step="5">
        </div>
        <div>
          <label for="lunch-start">휴게 시작</label>
          <input type="time" id="lunch-start">
        </div>
        <div>
          <label for="lunch-end">휴게 종료</label>
          <input type="time" id="lunch-end">
        </div>
      </div>
      <label>휴무 요일</label>
      <div class="weekday-checks" id="weekday-checks"></div>
      <label>상담 유형</label>
      <div class="types-list" id="types-list"></div>
      <div class="add-type-row">
        <input type="text" id="new-type-input" placeholder="새 상담 유형 추가">
        <button type="button" class="btn-secondary" id="add-type-btn">추가</button>
      </div>
      <button class="btn-primary" id="save-settings-btn">설정 저장</button>
      <div id="settings-msg" class="msg"></div>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'consulting_admin_token';
const WEEKDAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
const statusLabel = { pending: '대기중', confirmed: '확정', completed: '완료', cancelled: '취소됨' };

const loginView = document.getElementById('login-view');
const dashboardView = document.getElementById('dashboard-view');
const logoutLink = document.getElementById('logout-link');

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function showMsg(el, text, type) { el.textContent = text; el.className = 'msg ' + type; }
function clearMsg(el) { el.textContent = ''; el.className = 'msg'; }

async function apiFetch(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${getToken()}`,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    clearToken();
    renderAuthState();
    throw new Error('세션이 만료되었습니다. 다시 로그인해주세요.');
  }
  return res;
}

function renderAuthState() {
  if (getToken()) {
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
    logoutLink.style.display = 'inline';
    loadAppointments();
    loadSettings();
  } else {
    loginView.style.display = 'block';
    dashboardView.style.display = 'none';
    logoutLink.style.display = 'none';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginMsg = document.getElementById('login-msg');
  clearMsg(loginMsg);
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(loginMsg, data.error || '로그인에 실패했습니다.', 'error');
      return;
    }
    setToken(data.token);
    renderAuthState();
  } catch (err) {
    showMsg(loginMsg, '네트워크 오류가 발생했습니다.', 'error');
  }
});

logoutLink.addEventListener('click', (e) => {
  e.preventDefault();
  clearToken();
  renderAuthState();
});

const tbody = document.getElementById('appt-tbody');
const apptEmpty = document.getElementById('appt-empty');
const filterDate = document.getElementById('filter-date');
const filterStatus = document.getElementById('filter-status');

async function loadAppointments() {
  const params = new URLSearchParams();
  if (filterDate.value) params.set('date', filterDate.value);
  if (filterStatus.value) params.set('status', filterStatus.value);
  try {
    const res = await apiFetch(`/api/admin/appointments?${params.toString()}`);
    const data = await res.json();
    renderAppointments(data.appointments || []);
  } catch (err) { /* handled in apiFetch */ }
}

function renderAppointments(list) {
  if (!list.length) {
    tbody.innerHTML = '';
    apptEmpty.style.display = 'block';
    return;
  }
  apptEmpty.style.display = 'none';
  tbody.innerHTML = list.map((a) => `
    <tr data-id="${a.id}">
      <td>${a.date}</td>
      <td>${a.time}</td>
      <td>${escapeHtml(a.name)}</td>
      <td>${escapeHtml(a.phone)}</td>
      <td>${escapeHtml(a.consultingType)}</td>
      <td style="max-width:180px; white-space:pre-wrap;">${escapeHtml(a.memo || '')}</td>
      <td><span class="badge ${a.status}">${statusLabel[a.status] || a.status}</span></td>
      <td>
        <div class="actions">
          ${a.status === 'pending' ? `<button class="btn-secondary" data-action="confirmed">확정</button>` : ''}
          ${a.status === 'confirmed' ? `<button class="btn-secondary" data-action="completed">완료</button>` : ''}
          ${a.status !== 'cancelled' ? `<button class="btn-secondary" data-action="cancelled">취소</button>` : ''}
          <button class="btn-danger" data-action="delete">삭제</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

tbody.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const tr = btn.closest('tr');
  const id = tr.dataset.id;
  const action = btn.dataset.action;

  try {
    if (action === 'delete') {
      if (!confirm('이 예약을 완전히 삭제하시겠습니까?')) return;
      await apiFetch(`/api/admin/appointments/${id}`, { method: 'DELETE' });
    } else {
      await apiFetch(`/api/admin/appointments/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status: action }),
      });
    }
    loadAppointments();
  } catch (err) {
    alert(err.message || '처리 중 오류가 발생했습니다.');
  }
});

document.getElementById('refresh-btn').addEventListener('click', loadAppointments);
document.getElementById('clear-filter-btn').addEventListener('click', () => {
  filterDate.value = '';
  filterStatus.value = '';
  loadAppointments();
});
filterDate.addEventListener('change', loadAppointments);
filterStatus.addEventListener('change', loadAppointments);

const weekdayChecks = document.getElementById('weekday-checks');
weekdayChecks.innerHTML = WEEKDAY_NAMES.map((name, i) => `
  <label><input type="checkbox" value="${i}" class="weekday-cb"> ${name}</label>
`).join('');

let currentTypes = [];
const typesList = document.getElementById('types-list');

function renderTypes() {
  typesList.innerHTML = currentTypes.map((t, i) => `
    <span class="type-chip">${escapeHtml(t)} <button type="button" data-idx="${i}">&times;</button></span>
  `).join('');
}

typesList.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-idx]');
  if (!btn) return;
  currentTypes.splice(Number(btn.dataset.idx), 1);
  renderTypes();
});

document.getElementById('add-type-btn').addEventListener('click', () => {
  const input = document.getElementById('new-type-input');
  const val = input.value.trim();
  if (!val) return;
  currentTypes.push(val);
  input.value = '';
  renderTypes();
});

async function loadSettings() {
  try {
    const res = await apiFetch('/api/admin/settings');
    const data = await res.json();
    document.getElementById('business-start').value = data.businessStart;
    document.getElementById('business-end').value = data.businessEnd;
    document.getElementById('slot-minutes').value = data.slotMinutes;
    document.getElementById('lunch-start').value = data.lunchStart || '';
    document.getElementById('lunch-end').value = data.lunchEnd || '';
    document.querySelectorAll('.weekday-cb').forEach((cb) => {
      cb.checked = data.closedWeekdays.includes(Number(cb.value));
    });
    currentTypes = [...data.consultingTypes];
    renderTypes();
  } catch (err) { /* handled */ }
}

document.getElementById('save-settings-btn').addEventListener('click', async () => {
  const settingsMsg = document.getElementById('settings-msg');
  clearMsg(settingsMsg);
  const closedWeekdays = Array.from(document.querySelectorAll('.weekday-cb'))
    .filter((cb) => cb.checked)
    .map((cb) => Number(cb.value));

  const payload = {
    businessStart: document.getElementById('business-start').value,
    businessEnd: document.getElementById('business-end').value,
    slotMinutes: Number(document.getElementById('slot-minutes').value),
    lunchStart: document.getElementById('lunch-start').value,
    lunchEnd: document.getElementById('lunch-end').value,
    closedWeekdays,
    consultingTypes: currentTypes,
  };

  try {
    const res = await apiFetch('/api/admin/settings', { method: 'PUT', body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) {
      showMsg(settingsMsg, data.error || '저장에 실패했습니다.', 'error');
      return;
    }
    showMsg(settingsMsg, '설정이 저장되었습니다.', 'success');
  } catch (err) {
    showMsg(settingsMsg, err.message || '오류가 발생했습니다.', 'error');
  }
});

renderAuthState();
</script>
</body>
</html>
