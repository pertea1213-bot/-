<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진단 도구 모음</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 2rem;
    color: #1a202c;
    margin-bottom: 12px;
  }
  p {
    color: #718096;
    margin-bottom: 40px;
    font-size: 1rem;
  }
  .cards {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px;
    width: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.14);
  }
  .card .icon {
    font-size: 2.8rem;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.2rem;
    color: #2d3748;
    margin-bottom: 10px;
  }
  .card p {
    font-size: 0.9rem;
    color: #a0aec0;
    margin-bottom: 0;
  }
</style>
</head>
<body>
<div class="container">
  <h1>진단 도구 모음</h1>
  <p>아래 도구를 선택하여 시작하세요.</p>
  <div class="cards">
    <a class="card" href="360feedback.html">
      <div class="icon">📊</div>
      <h2>다면평가 시스템</h2>
      <p>360도 피드백 기반의 역량 평가 도구</p>
    </a>
    <a class="card" href="resilience.html">
      <div class="icon">🌱</div>
      <h2>회복탄력성 진단</h2>
      <p>자기조절, 대인관계, 긍정성 측정</p>
    </a>
    <a class="card" href="career.html">
      <div class="icon">🧭</div>
      <h2>생애경력설계 진단</h2>
      <p>8대 역량 40문항 · GAP 분석 · 방사형 차트</p>
    </a>
  </div>
</div>
</body>
</html>
