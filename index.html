<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM 관리 툴 | 컨설팅 프로젝트 관리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  header {
    padding: 24px 0;
  }
  .topnav { display: flex; justify-content: space-between; align-items: center; }
  .topnav .logo { font-weight: 700; font-size: 1.1rem; color: #2d3748; text-decoration: none; }
  .topnav a.nav-login {
    color: #4299e1;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .topnav a.nav-login:hover { text-decoration: underline; }

  .hero {
    text-align: center;
    padding: 64px 0 56px;
  }
  .hero h1 {
    font-size: 2.1rem;
    line-height: 1.4;
    color: #1a202c;
    margin-bottom: 16px;
  }
  .hero h1 span { color: #4299e1; }
  .hero p {
    font-size: 1rem;
    color: #718096;
    margin-bottom: 32px;
  }
  .btn-primary {
    display: inline-block;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    background: #4299e1;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary:hover { background: #3182ce; }

  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 56px;
  }
  .feature-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .feature-card .icon {
    font-size: 1.6rem;
    margin-bottom: 12px;
  }
  .feature-card h2 {
    font-size: 1.02rem;
    margin-bottom: 8px;
    color: #2d3748;
  }
  .feature-card p {
    font-size: 0.86rem;
    color: #718096;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 24px 0 40px;
    color: #a0aec0;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topnav">
      <a href="/" class="logo">PM 관리 툴</a>
      <a href="/pm.html" class="nav-login">로그인</a>
    </div>
  </header>

  <section class="hero">
    <h1>컨설팅 프로젝트를,<br><span>한눈에</span> 관리하세요</h1>
    <p>진행 중인 컨설팅 프로젝트, 작업, 마일스톤을 하나의 대시보드에서 확인하고 관리합니다.</p>
    <a href="/pm.html" class="btn-primary">시작하기</a>
  </section>

  <section class="features">
    <div class="feature-card">
      <div class="icon">📊</div>
      <h2>프로젝트 대시보드</h2>
      <p>전체 프로젝트, 진행중, 작업, 지연 현황을 통계로 한눈에 확인할 수 있습니다.</p>
    </div>
    <div class="feature-card">
      <div class="icon">🗂️</div>
      <h2>칸반 보드</h2>
      <p>할 일, 진행중, 완료 단계로 작업을 관리하며 프로젝트 흐름을 추적합니다.</p>
    </div>
    <div class="feature-card">
      <div class="icon">✅</div>
      <h2>마일스톤 체크리스트</h2>
      <p>주요 마일스톤을 등록하고 완료 여부를 체크하며 진행률을 관리합니다.</p>
    </div>
  </section>

  <footer>
    &copy; 2026 PM 관리 툴
  </footer>
</div>
</body>
</html>
