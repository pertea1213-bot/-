<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>경영·기술지도사 연간 스케줄</title>
<style>
*{box-sizing:border-box}
:root{--u:min(1vw,1.7778vh)}
html,body{height:100%;margin:0;background:#06142b}
body{display:flex;align-items:center;justify-content:center;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#fff}
.stage{width:calc(var(--u)*100);height:calc(var(--u)*56.25);background:linear-gradient(135deg,#0f2748,#1d4e89);padding:calc(var(--u)*2) calc(var(--u)*2.5);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:calc(var(--u)*1.5)}
h1{margin:0;font-size:calc(var(--u)*4.2);letter-spacing:-1px}
h1 small{display:block;font-size:calc(var(--u)*1.8);font-weight:400;opacity:.8;margin-top:6px;letter-spacing:0}
.badge{font-size:calc(var(--u)*1.8);padding:calc(var(--u)*.6) calc(var(--u)*1.6);border:2px solid rgba(255,255,255,.6);border-radius:99px}
.card{flex:1;background:#fff;border-radius:calc(var(--u)*1.4);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:calc(var(--u)*1.2);display:flex;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;height:100%;table-layout:fixed;color:#1a2a44}
thead th{height:10%;background:#1d4e89;color:#fff;font-size:calc(var(--u)*2.1);border-left:1px solid rgba(255,255,255,.25)}
thead th:first-child{border-top-left-radius:12px;border-left:0;width:21%}
thead th:last-child{border-top-right-radius:12px}
td{border-bottom:1px solid #d5deea;border-left:1px solid #e3e9f2}
tbody tr:nth-child(even) td{background:#f6f9fd}
th.row{text-align:left;padding:0 calc(var(--u)*1.3);border-bottom:1px solid #d5deea;color:#fff}
.r0{background:#1d4e89}.r1{background:#2f6fb5}.r2{background:#3f8ad0}.r3{background:#5aa2e3}
th.row .t{font-size:calc(var(--u)*2.3);font-weight:700;white-space:nowrap}
th.row .s{font-size:calc(var(--u)*1.8);opacity:.9;margin-top:4px}
td.ar{padding:0 6px;background:transparent!important}
.arrow{height:62%;background:linear-gradient(90deg,#ff9f1c,#ff6b35);clip-path:polygon(0 0,calc(100% - calc(var(--u)*3)) 0,100% 50%,calc(100% - calc(var(--u)*3)) 100%,0 100%);display:flex;align-items:center;padding-left:calc(var(--u)*1.5);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.arrow span{color:#fff;font-weight:700;font-size:calc(var(--u)*2.5);text-shadow:0 1px 2px rgba(0,0,0,.3);white-space:nowrap}
.a2{background:linear-gradient(90deg,#00b4a6,#0a8f9c)}
.arrow.cont{clip-path:polygon(0 0,100% 0,calc(100% - calc(var(--u)*1.2)) 50%,100% 100%,0 100%)}
tbody tr{height:22.5%}
.arrow.sm{padding-left:calc(var(--u)*.8)}
.arrow.sm span{font-size:calc(var(--u)*1.8)}
</style></head><body><div class="stage">
<header><h1>경영지도사 · 기술지도사 연간 스케줄<small>11월 ~ 익년 10월</small></h1><div class="badge">2026</div></header>
<div class="card"><table><thead><tr><th>구분</th><th>11월</th><th>12월</th><th>1월</th><th>2월</th><th>3월</th><th>4월</th><th>5월</th><th>6월</th><th>7월</th><th>8월</th><th>9월</th><th>10월</th></tr></thead><tbody><tr><th class='row r0'><div class='t'>정부 지원사업</div><div class='s'>(공공 컨설팅)</div></th><td class='ar'><div class='arrow sm'><span>11월</span></div></td><td></td><td></td><td></td><td></td><td colspan='7' class='ar'><div class='arrow cont'><span>중앙정부 · 4월 ~ 11월 →</span></div></td></tr><tr><th class='row r1'><div class='t'>진단 · 심사평가</div><div class='s'>등</div></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><th class='row r2'><div class='t'>교육 · 강의</div><div class='s'></div></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><th class='row r3'><div class='t'>자문</div><div class='s'></div></th><td></td><td colspan='5' class='ar'><div class='arrow a2'><span>12월 ~ 4월</span></div></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>
</div></body></html>
