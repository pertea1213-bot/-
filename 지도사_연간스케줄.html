<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>경영·기술지도사 연간 스케줄</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:linear-gradient(135deg,#0f2748,#1d4e89);color:#fff;display:flex;flex-direction:column;padding:2.5vh 3vw}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2vh}
h1{margin:0;font-size:clamp(24px,3.4vw,48px);letter-spacing:-1px}
h1 small{display:block;font-size:.4em;font-weight:400;opacity:.75;margin-top:6px;letter-spacing:0}
.badge{font-size:clamp(12px,1.2vw,18px);padding:8px 16px;border:1px solid rgba(255,255,255,.5);border-radius:99px}
.card{flex:1;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:1.5vh 1.5vw;display:flex;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;height:100%;table-layout:fixed;color:#1a2a44}
thead th{height:9%;background:#1d4e89;color:#fff;font-size:clamp(13px,1.5vw,22px);border-left:1px solid rgba(255,255,255,.25)}
thead th:first-child{border-top-left-radius:12px;border-left:0;width:17%}
thead th:last-child{border-top-right-radius:12px}
td{border-bottom:1px solid #d5deea;border-left:1px solid #e3e9f2}
tbody tr:nth-child(even) td{background:#f6f9fd}
th.row{text-align:left;padding:0 1.2vw;border-bottom:1px solid #d5deea;color:#fff}
.r0{background:#1d4e89}.r1{background:#2f6fb5}.r2{background:#3f8ad0}.r3{background:#5aa2e3}
th.row .t{font-size:clamp(16px,2vw,30px);font-weight:700}
th.row .s{font-size:clamp(12px,1.2vw,18px);opacity:.85;margin-top:4px}
td.ar{padding:0 6px;background:transparent!important}
.arrow{height:56%;background:linear-gradient(90deg,#ff9f1c,#ff6b35);clip-path:polygon(0 0,calc(100% - 46px) 0,100% 50%,calc(100% - 46px) 100%,0 100%);display:flex;align-items:center;padding-left:24px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.arrow span{color:#fff;font-weight:700;font-size:clamp(14px,1.7vw,26px);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.a2{background:linear-gradient(90deg,#00b4a6,#0a8f9c)}
.arrow.cont{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%);padding-left:14px}
.arrow.cont span{font-size:clamp(11px,1.2vw,18px)}
</style></head><body>
<header><h1>경영지도사 · 기술지도사 연간 스케줄<small>11월 ~ 익년 10월</small></h1><div class="badge">2026</div></header>
<div class="card"><table><thead><tr><th>구분</th><th>11월</th><th>12월</th><th>1월</th><th>2월</th><th>3월</th><th>4월</th><th>5월</th><th>6월</th><th>7월</th><th>8월</th><th>9월</th><th>10월</th></tr></thead><tbody><tr><th class='row r0'><div class='t'>정부 지원사업</div><div class='s'>(공공 컨설팅)</div></th><td class='ar'><div class='arrow'><span>~ 11월</span></div></td><td></td><td></td><td></td><td></td><td colspan='7' class='ar'><div class='arrow cont'><span>중앙정부 · 4월 ~ 11월 →</span></div></td></tr><tr><th class='row r1'><div class='t'>진단 · 심사평가</div><div class='s'>등</div></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><th class='row r2'><div class='t'>교육 · 강의</div><div class='s'></div></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><th class='row r3'><div class='t'>자문</div><div class='s'></div></th><td></td><td colspan='5' class='ar'><div class='arrow a2'><span>12월 ~ 4월</span></div></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>
</body></html>
