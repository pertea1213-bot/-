name: 사업공고 자동 알림

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = KST 09:00
  workflow_dispatch: {}

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
        working-directory: announcement-alert

      - run: node src/index.js
        working-directory: announcement-alert
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      - name: 발송 이력 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add announcement-alert/data/sent-ids.json
          git diff --cached --quiet || git commit -m "chore: 사업공고 발송 이력 업데이트"
          git push
