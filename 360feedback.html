<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다면평가 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #fff;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
    .header-logo{font-size:18px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px}
    .header-nav{display:flex;gap:10px}
    .screen{display:none}.screen.active{display:block}
    .container{max-width:780px;margin:0 auto;padding:28px 16px}
    .card{background:var(--white);border-radius:12px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px}
    .card-title{font-size:21px;font-weight:700;margin-bottom:6px}
    .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.6}
    .form-group{margin-bottom:18px}
    .form-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
    .required{color:var(--danger);margin-left:2px}
    .optional{color:var(--text-muted);font-weight:400}
    .form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
    .form-input:focus{border-color:var(--primary)}
    .radio-group{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .radio-card{border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:11px;user-select:none}
    .radio-card:hover{border-color:var(--primary);background:var(--primary-light)}
    .radio-card.selected{border-color:var(--primary);background:var(--primary-light)}
    .radio-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .radio-card-text .rc-title{font-weight:600;font-size:14px}
    .radio-card-text .rc-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none;outline:none;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#1d4ed8}.btn-primary:disabled{background:#93c5fd;cursor:not-allowed}
    .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
    .btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
    .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger)}.btn-danger:hover{background:#fef2f2}
    .btn-full{width:100%}
    .progress-wrap{margin-bottom:28px}
    .progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:7px}
    .progress-bg{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
    .progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s ease}
    .cat-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:18px}
    .q-item{padding:18px 0;border-bottom:1px solid var(--border)}
    .q-item:last-child{border-bottom:none}
    .q-text{font-size:14px;font-weight:500;margin-bottom:13px;line-height:1.6;display:flex;align-items:flex-start;gap:8px}
    .q-num{display:inline-flex;width:22px;height:22px;background:var(--primary);color:#fff;border-radius:50%;font-size:11px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .rating-row{display:flex;gap:6px;align-items:flex-end}
    .r-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
    .r-circle{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text-muted);transition:all .18s}
    .r-btn:hover .r-circle{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
    .r-btn.selected .r-circle{background:var(--primary);border-color:var(--primary);color:#fff}
    .r-label{font-size:9px;color:var(--text-muted);text-align:center;width:42px;line-height:1.3}
    .nav-btns{display:flex;gap:10px;justify-content:space-between;margin-top:20px}
    .result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:22px}
    .stat-card{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
    .stat-val{font-size:24px;font-weight:700;color:var(--primary)}
    .stat-lbl{font-size:11px;color:var(--text-muted);margin-top:3px}
    .chart-wrap{position:relative;height:320px;margin:16px auto;max-width:480px}
    .score-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
    .score-row:last-child{border-bottom:none}
    .score-name{width:140px;font-size:13px;font-weight:500;flex-shrink:0}
    .score-bar-bg{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
    .score-bar{height:100%;border-radius:4px;transition:width .8s ease}
    .score-val{width:36px;text-align:right;font-size:13px;font-weight:600;color:var(--primary)}
    .tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px}
    .tab{padding:9px 18px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab-pane{display:none}.tab-pane.active{display:block}
    .cmp-table{width:100%;border-collapse:collapse;font-size:13px}
    .cmp-table th,.cmp-table td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--border)}
    .cmp-table th{background:var(--bg);font-weight:600;color:var(--text-muted);font-size:12px}
    .cmp-table td:first-child{text-align:left;font-weight:500}
    .cmp-table tr:last-child td{border-bottom:none;background:var(--bg);font-weight:600}
    .resp-list{display:flex;flex-direction:column;gap:10px}
    .resp-item{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:var(--bg);border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
    .resp-item:hover{border-color:var(--primary);background:var(--primary-light)}
    .resp-name{font-weight:600;font-size:15px}
    .resp-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
    .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
    .tag{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
    .empty{text-align:center;padding:56px 24px;color:var(--text-muted)}
    .empty-icon{font-size:44px;margin-bottom:14px}
    .empty-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:7px}
    .done-icon{width:76px;height:76px;background:#d1fae5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px}
    .toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:999;transform:translateY(16px);opacity:0;transition:all .3s;pointer-events:none}
    .toast.show{transform:translateY(0);opacity:1}
    .info-row{display:flex;gap:28px;flex-wrap:wrap}
    .info-item{flex:1;min-width:130px}
    .info-item .lbl{font-size:12px;color:var(--text-muted);margin-bottom:3px}
    .info-item .val{font-weight:600;font-size:14px}
    @media(max-width:580px){
      .radio-group{grid-template-columns:1fr}
      .r-circle{width:36px;height:36px;font-size:13px}
      .r-label{width:36px}
      .card{padding:18px 14px}
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">📋 다면평가 시스템</div>
  <div class="header-nav">
    <button class="btn btn-ghost" onclick="goAdmin()">📊 관리자</button>
    <button class="btn btn-primary" onclick="goStart()">✏️ 평가 참여</button>
  </div>
</header>

<!-- ===== START ===== -->
<div id="s-start" class="screen active">
  <div class="container">
    <div class="card">
      <div class="card-title">다면평가에 오신 것을 환영합니다</div>
      <div class="card-desc">다양한 관점에서 구성원의 역량을 측정하는 평가입니다.<br>솔직하고 공정한 평가를 부탁드립니다.</div>

      <div class="form-group">
        <label class="form-label">피평가자 이름 <span class="required">*</span></label>
        <input class="form-input" id="inp-evaluatee" placeholder="평가 대상자의 이름을 입력하세요" oninput="checkStart()">
      </div>

      <div class="form-group">
        <label class="form-label">평가자 유형 <span class="required">*</span></label>
        <div class="radio-group" id="type-group"></div>
      </div>

      <div class="form-group">
        <label class="form-label">평가자 이름 <span class="optional">(선택 · 익명 가능)</span></label>
        <input class="form-input" id="inp-rater" placeholder="본인의 이름을 입력하세요">
      </div>

      <button class="btn btn-primary btn-full" id="btn-start" onclick="startEval()" disabled>
        평가 시작하기 →
      </button>
    </div>

    <div class="card" style="padding:18px 28px">
      <div class="info-row">
        <div class="info-item"><div class="lbl">평가 영역</div><div class="val">5개 역량 · 20개 문항</div></div>
        <div class="info-item"><div class="lbl">소요 시간</div><div class="val">약 5 ~ 10분</div></div>
        <div class="info-item"><div class="lbl">평가 척도</div><div class="val">5점 척도 (1 ~ 5점)</div></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== EVALUATE ===== -->
<div id="s-eval" class="screen">
  <div class="container">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="prog-text"></span>
        <span id="prog-pct"></span>
      </div>
      <div class="progress-bg"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <div class="card" id="cat-card"></div>
    <div class="nav-btns">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevCat()">← 이전</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextCat()">다음 →</button>
    </div>
  </div>
</div>

<!-- ===== COMPLETE ===== -->
<div id="s-done" class="screen">
  <div class="container" style="max-width:480px;text-align:center;padding-top:72px">
    <div class="done-icon">✅</div>
    <h2 style="font-size:22px;font-weight:700;margin-bottom:10px">평가 완료!</h2>
    <p style="color:var(--text-muted);font-size:14px;line-height:1.7;margin-bottom:28px">
      <strong id="done-name"></strong>에 대한 평가가<br>성공적으로 제출되었습니다.<br>참여해 주셔서 감사합니다.
    </p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-outline" onclick="goAdmin()">결과 보기</button>
      <button class="btn btn-primary" onclick="goStart()">다른 평가 참여</button>
    </div>
  </div>
</div>

<!-- ===== ADMIN ===== -->
<div id="s-admin" class="screen">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:20px;font-weight:700">평가 결과 관리</h2>
        <p style="font-size:13px;color:var(--text-muted);margin-top:3px">피평가자를 선택하면 상세 결과를 확인할 수 있습니다.</p>
      </div>
      <button class="btn btn-danger" onclick="clearAll()">전체 초기화</button>
    </div>
    <div id="resp-list"></div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="s-result" class="screen">
  <div class="container">
    <button class="btn btn-ghost" onclick="goAdmin()" style="margin-bottom:18px">← 목록으로</button>
    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px">
        <div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">다면평가 결과</div>
          <h2 id="res-name" style="font-size:22px;font-weight:700"></h2>
        </div>
        <button class="btn btn-outline" onclick="exportCSV()" style="font-size:13px;padding:8px 14px">⬇ CSV 다운로드</button>
      </div>

      <div class="result-stats" id="res-stats"></div>

      <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">종합 결과</div>
        <div class="tab" onclick="switchTab(1)">유형별 비교</div>
      </div>

      <div class="tab-pane active" id="tp-0">
        <div class="chart-wrap"><canvas id="chart-overall"></canvas></div>
        <div id="cat-scores"></div>
      </div>
      <div class="tab-pane" id="tp-1">
        <div class="chart-wrap"><canvas id="chart-compare"></canvas></div>
        <div style="overflow-x:auto;margin-top:16px"><table class="cmp-table" id="cmp-tbl"></table></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 평가 항목 ─────────────────────────────────────────── */
const CATS = [
  {
    id:'job', name:'직무역량', icon:'💼', color:'#2563eb', bg:'#eff6ff',
    qs:[
      '맡은 업무에 필요한 전문 지식과 기술을 보유하고 있다',
      '업무를 정확하고 신속하게 처리한다',
      '새로운 지식과 기술을 적극적으로 습득한다',
      '업무 결과물의 품질이 높다',
    ]
  },
  {
    id:'leadership', name:'리더십', icon:'🌟', color:'#d97706', bg:'#fffbeb',
    qs:[
      '명확한 목표와 방향을 제시한다',
      '구성원의 성장과 발전을 적극적으로 지원한다',
      '공정하고 일관된 기준으로 의사결정을 한다',
      '어려운 상황에서도 팀을 이끄는 리더십을 발휘한다',
    ]
  },
  {
    id:'comm', name:'소통/협업', icon:'🤝', color:'#059669', bg:'#ecfdf5',
    qs:[
      '상대방의 의견을 경청하고 존중한다',
      '자신의 생각을 명확하고 효과적으로 표현한다',
      '팀원들과 협력하여 공동의 목표를 달성한다',
      '갈등 상황을 건설적으로 해결한다',
    ]
  },
  {
    id:'innov', name:'문제해결/혁신', icon:'💡', color:'#7c3aed', bg:'#f5f3ff',
    qs:[
      '문제의 원인을 정확하게 파악하고 해결책을 제시한다',
      '창의적인 아이디어로 업무를 개선한다',
      '변화에 유연하게 적응하고 새로운 도전을 받아들인다',
      '데이터와 근거를 바탕으로 합리적인 의사결정을 한다',
    ]
  },
  {
    id:'perf', name:'성과/책임', icon:'🎯', color:'#dc2626', bg:'#fef2f2',
    qs:[
      '높은 목표를 설정하고 달성하기 위해 노력한다',
      '내·외부 고객의 요구를 파악하고 적극적으로 대응한다',
      '약속과 기한을 준수한다',
      '결과에 대한 책임감을 가지고 업무에 임한다',
    ]
  },
];

const TYPES = [
  { id:'self',        label:'본인',     desc:'자기평가',             icon:'🪞', color:'#6366f1', bg:'#eef2ff' },
  { id:'superior',    label:'상사',     desc:'상향평가 (부하→상사)', icon:'⬆️', color:'#f59e0b', bg:'#fffbeb' },
  { id:'peer',        label:'동료',     desc:'동료평가',             icon:'🤝', color:'#10b981', bg:'#ecfdf5' },
  { id:'subordinate', label:'부하직원', desc:'하향평가 (상사→부하)', icon:'⬇️', color:'#3b82f6', bg:'#eff6ff' },
];

const RLABELS = ['','매우 미흡','미흡','보통','우수','매우 우수'];
const STORE_KEY = 'mra_v1';

/* ── 상태 ─────────────────────────────────────────────── */
let S = { catIdx:0, formData:{}, answers:{}, resultTarget:'', charts:{} };

/* ── 스토리지 ─────────────────────────────────────────── */
const load  = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch { return []; } };
const save  = d => localStorage.setItem(STORE_KEY, JSON.stringify(d));
const push  = r => { const d = load(); d.push(r); save(d); };

/* ── 화면 전환 ────────────────────────────────────────── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function goStart() {
  S = { catIdx:0, formData:{}, answers:{}, resultTarget:'', charts:S.charts };
  renderStart();
  show('start');
}

function goAdmin() {
  renderAdmin();
  show('admin');
}

/* ── 시작 화면 ────────────────────────────────────────── */
function renderStart() {
  document.getElementById('type-group').innerHTML = TYPES.map(t => `
    <div class="radio-card" id="tc-${t.id}" onclick="selectType('${t.id}')">
      <div class="radio-icon" style="background:${t.bg}">${t.icon}</div>
      <div class="radio-card-text">
        <div class="rc-title">${t.label}</div>
        <div class="rc-desc">${t.desc}</div>
      </div>
    </div>`).join('');
  document.getElementById('inp-evaluatee').value = '';
  document.getElementById('inp-rater').value = '';
  document.getElementById('btn-start').disabled = true;
}

function selectType(id) {
  S.formData.type = id;
  document.querySelectorAll('.radio-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('tc-'+id)?.classList.add('selected');
  checkStart();
}

function checkStart() {
  const v = document.getElementById('inp-evaluatee').value.trim();
  document.getElementById('btn-start').disabled = !(v && S.formData.type);
}

function startEval() {
  const evaluatee = document.getElementById('inp-evaluatee').value.trim();
  if (!evaluatee || !S.formData.type) { toast('피평가자 이름과 평가자 유형을 입력해주세요.'); return; }
  S.formData.evaluatee = evaluatee;
  S.formData.rater = document.getElementById('inp-rater').value.trim() || '익명';
  S.answers = {};
  S.catIdx = 0;
  renderCat(0);
  show('eval');
}

/* ── 평가 화면 ────────────────────────────────────────── */
function renderCat(idx) {
  const cat = CATS[idx];
  const pct = Math.round(((idx+1)/CATS.length)*100);
  document.getElementById('prog-text').textContent = `${cat.name} (${idx+1}/${CATS.length})`;
  document.getElementById('prog-pct').textContent   = pct+'%';
  document.getElementById('prog-fill').style.width  = pct+'%';
  document.getElementById('btn-prev').disabled      = idx === 0;
  document.getElementById('btn-next').textContent   = idx === CATS.length-1 ? '제출하기 ✓' : '다음 →';

  document.getElementById('cat-card').innerHTML = `
    <div class="cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.icon} ${cat.name}</div>
    ${cat.qs.map((q,qi) => {
      const qid = `${cat.id}_${qi}`;
      const sel = S.answers[qid];
      return `
        <div class="q-item">
          <div class="q-text"><span class="q-num">${qi+1}</span>${q}</div>
          <div class="rating-row">
            ${[1,2,3,4,5].map(v => `
              <div class="r-btn ${sel===v?'selected':''}" data-qid="${qid}" data-val="${v}" onclick="pickRating('${qid}',${v})">
                <div class="r-circle">${v}</div>
                <div class="r-label">${RLABELS[v]}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }).join('')}`;
}

function pickRating(qid, val) {
  S.answers[qid] = val;
  document.querySelectorAll(`[data-qid="${qid}"]`).forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.val) === val);
  });
}

function prevCat() {
  if (S.catIdx > 0) { S.catIdx--; renderCat(S.catIdx); }
}

function nextCat() {
  const cat = CATS[S.catIdx];
  if (!cat.qs.every((_,qi) => S.answers[`${cat.id}_${qi}`] != null)) {
    toast('모든 문항에 답변해주세요.'); return;
  }
  if (S.catIdx < CATS.length-1) { S.catIdx++; renderCat(S.catIdx); }
  else submitEval();
}

function submitEval() {
  push({ id:Date.now()+'', evaluatee:S.formData.evaluatee, type:S.formData.type,
         rater:S.formData.rater, answers:{...S.answers}, ts:new Date().toISOString() });
  document.getElementById('done-name').textContent = S.formData.evaluatee;
  show('done');
  toast('평가가 성공적으로 제출되었습니다!');
}

/* ── 관리자 화면 ──────────────────────────────────────── */
function renderAdmin() {
  const data = load();
  const el = document.getElementById('resp-list');

  if (!data.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">아직 평가 데이터가 없습니다</div>
      <div style="font-size:13px;margin-bottom:20px">평가를 진행하면 여기서 결과를 확인할 수 있습니다.</div>
      <button class="btn btn-primary" onclick="goStart()">평가 참여하기</button>
    </div>`;
    return;
  }

  const grouped = {};
  data.forEach(r => { (grouped[r.evaluatee]??=[]).push(r); });
  const tMap = Object.fromEntries(TYPES.map(t=>[t.id,t]));

  el.innerHTML = `<div class="resp-list">${
    Object.entries(grouped).map(([name, rows]) => {
      const cnt = {};
      rows.forEach(r => { cnt[r.type]=(cnt[r.type]||0)+1; });
      const tags = Object.entries(cnt).map(([id,n]) =>
        `<span class="tag" style="background:${tMap[id].color}22;color:${tMap[id].color}">${tMap[id].label} ${n}명</span>`
      ).join('');
      return `<div class="resp-item" onclick="showResult('${name.replace(/'/g,"\\'")}')">
        <div>
          <div class="resp-name">${name}</div>
          <div class="resp-meta">총 ${rows.length}명 응답</div>
          <div class="tags">${tags}</div>
        </div>
        <span style="color:var(--text-muted);font-size:18px">›</span>
      </div>`;
    }).join('')
  }</div>`;
}

function clearAll() {
  if (!confirm('모든 평가 데이터를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(STORE_KEY);
  renderAdmin();
  toast('데이터가 초기화되었습니다.');
}

/* ── 결과 화면 ────────────────────────────────────────── */
function showResult(name) {
  S.resultTarget = name;
  Object.values(S.charts).forEach(c => c?.destroy());
  S.charts = {};
  renderResult(name);
  show('result');
  switchTab(0);
  setTimeout(() => { buildOverallChart(name); buildCompareChart(name); }, 80);
}

function catAvg(rows, cat) {
  const vals = rows.flatMap(r => cat.qs.map((_,qi) => r.answers[`${cat.id}_${qi}`]).filter(v=>v!=null));
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function renderResult(name) {
  const data = load().filter(r => r.evaluatee === name);
  document.getElementById('res-name').textContent = name;

  /* 통계 */
  const cnt = {}; TYPES.forEach(t => { cnt[t.id]=0; }); data.forEach(r => cnt[r.type]++);
  const allVals = data.flatMap(r => Object.values(r.answers));
  const overall = allVals.length ? (allVals.reduce((a,b)=>a+b,0)/allVals.length).toFixed(2) : '-';

  document.getElementById('res-stats').innerHTML = [
    {l:'총 응답', v:data.length+'명'},
    ...TYPES.map(t=>({l:t.label, v:cnt[t.id]+'명'})),
    {l:'전체 평균', v:overall+'점'},
  ].map(s=>`<div class="stat-card"><div class="stat-val">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join('');

  /* 카테고리 점수 바 */
  document.getElementById('cat-scores').innerHTML = CATS.map(cat => {
    const avg = catAvg(data, cat) ?? 0;
    return `<div class="score-row">
      <div class="score-name">${cat.icon} ${cat.name}</div>
      <div class="score-bar-bg"><div class="score-bar" style="width:${(avg/5)*100}%;background:${cat.color}"></div></div>
      <div class="score-val">${avg.toFixed(2)}</div>
    </div>`;
  }).join('');

  /* 비교 테이블 */
  const tMap = Object.fromEntries(TYPES.map(t=>[t.id,t]));
  const header = `<tr><th>역량</th>${TYPES.map(t=>`<th style="color:${t.color}">${t.icon} ${t.label}</th>`).join('')}<th>전체평균</th></tr>`;
  const bodyRows = CATS.map(cat => {
    const byType = TYPES.map(t => {
      const v = catAvg(data.filter(r=>r.type===t.id), cat);
      return v != null ? v.toFixed(2) : '-';
    });
    const overall2 = catAvg(data, cat);
    return `<tr>
      <td>${cat.icon} ${cat.name}</td>
      ${byType.map((v,i)=>`<td style="color:${v!=='-'?TYPES[i].color:'var(--text-muted)'}">${v}</td>`).join('')}
      <td><strong>${overall2!=null?overall2.toFixed(2):'-'}</strong></td>
    </tr>`;
  }).join('');
  const totalRow = `<tr>
    <td>전체 평균</td>
    ${TYPES.map(t=>{
      const tv = data.filter(r=>r.type===t.id).flatMap(r=>Object.values(r.answers));
      const av = tv.length?(tv.reduce((a,b)=>a+b,0)/tv.length).toFixed(2):'-';
      return `<td style="color:${av!=='-'?t.color:'var(--text-muted)'}">${av}</td>`;
    }).join('')}
    <td>${overall}</td>
  </tr>`;
  document.getElementById('cmp-tbl').innerHTML = header + bodyRows + totalRow;
}

function buildOverallChart(name) {
  const data = load().filter(r => r.evaluatee === name);
  const avgs = CATS.map(cat => catAvg(data, cat) ?? 0);
  const ctx = document.getElementById('chart-overall').getContext('2d');
  S.charts.overall = new Chart(ctx, {
    type:'radar',
    data:{
      labels: CATS.map(c=>c.name),
      datasets:[{ label:'전체 평균', data:avgs,
        backgroundColor:'rgba(37,99,235,.15)', borderColor:'#2563eb',
        borderWidth:2.5, pointBackgroundColor:'#2563eb', pointRadius:4 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{r:{min:0,max:5,ticks:{stepSize:1,font:{size:11}},
        pointLabels:{font:{size:12,weight:'600'}},grid:{color:'#e2e8f0'}}},
      plugins:{legend:{display:false}}
    }
  });
}

function buildCompareChart(name) {
  const data = load().filter(r => r.evaluatee === name);
  const datasets = TYPES.map(t => {
    const rows = data.filter(r=>r.type===t.id);
    if (!rows.length) return null;
    return {
      label:t.label,
      data: CATS.map(cat => catAvg(rows, cat) ?? 0),
      backgroundColor: t.color+'26', borderColor:t.color,
      borderWidth:2, pointBackgroundColor:t.color, pointRadius:4
    };
  }).filter(Boolean);

  const ctx = document.getElementById('chart-compare').getContext('2d');
  S.charts.compare = new Chart(ctx, {
    type:'radar',
    data:{ labels:CATS.map(c=>c.name), datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{r:{min:0,max:5,ticks:{stepSize:1,font:{size:11}},
        pointLabels:{font:{size:12,weight:'600'}},grid:{color:'#e2e8f0'}}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:11,padding:14,font:{size:12}}}}
    }
  });
}

/* ── 탭 ───────────────────────────────────────────────── */
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('active',i===idx));
}

/* ── CSV 내보내기 ──────────────────────────────────────── */
function exportCSV() {
  const name = S.resultTarget;
  const data = load().filter(r=>r.evaluatee===name);
  const tLabel = Object.fromEntries(TYPES.map(t=>[t.id,t.label]));

  const headers = ['피평가자','평가자유형','평가자명','평가일시',
    ...CATS.flatMap(cat=>cat.qs.map((_,qi)=>`${cat.name}_Q${qi+1}`)),
    ...CATS.map(cat=>`${cat.name}_평균`), '전체평균'];

  const rows = data.map(r => {
    const catAvgs = CATS.map(cat => { const v=catAvg([r],cat); return v!=null?v.toFixed(2):''; });
    const av = Object.values(r.answers);
    const ov = av.length?(av.reduce((a,b)=>a+b,0)/av.length).toFixed(2):'';
    return [r.evaluatee, tLabel[r.type]||r.type, r.rater,
      new Date(r.ts).toLocaleString('ko-KR'),
      ...CATS.flatMap(cat=>cat.qs.map((_,qi)=>r.answers[`${cat.id}_${qi}`]??'')),
      ...catAvgs, ov];
  });

  const csv = [headers,...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `다면평가_${name}_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'').replace('.','')}`.replace(/\s/g,'')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV 파일이 다운로드되었습니다.');
}

/* ── 토스트 ───────────────────────────────────────────── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ── 초기화 ───────────────────────────────────────────── */
renderStart();
</script>
